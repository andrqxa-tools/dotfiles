# Ціль: systemd-oomd має вбивати важкий застосунок, а не всю GNOME-сесію.
#
# Дефолт Ubuntu моніторить /user.slice/user-1000.slice/user@1000.service,
# тому в кандидати на кілл потрапляють dbus.service і gnome-shell —
# інцидент 2026-07-29 14:55: pressure 97.33% > 80%, вбито 12 юнітів,
# сесію викинуло на GDM.
#
# Тут вмикаємо окреме правило на app.slice з нижчою межею, щоб воно
# спрацювало РАНІШЕ за правило рівня user@.service. Все важке
# (tmux-панелі, браузери, IDE) живе саме в app.slice.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=65%
