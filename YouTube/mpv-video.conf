# Isolated mpv configuration used only by `yt v` (video inside the terminal).
# The video output backend is chosen by the script (--vo=kitty|sixel|tct).
profile=sw-fast
ytdl=yes
# Terminal resolution is tiny, so a small stream saves a lot of CPU.
ytdl-format=bestvideo[height<=?720]+bestaudio/best[height<=?720]/best
hwdec=no
vo-sixel-fixedpalette=no
cache=yes
cache-secs=30
demuxer-max-bytes=128MiB
demuxer-readahead-secs=20
term-osd=force
input-terminal=yes
