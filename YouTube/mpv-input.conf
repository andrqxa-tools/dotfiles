# Shared input bindings for `yt` (both audio and video modes).
# Loaded with --input-conf, so mpv's built-in defaults stay in place and only
# these keys are overridden.

# Seek. LEFT/RIGHT and UP/DOWN repeat mpv's defaults explicitly so the help
# text and the actual bindings cannot drift apart.
RIGHT        seek  5
LEFT         seek -5
Shift+RIGHT  seek  30
Shift+LEFT   seek -30
UP           seek  60
DOWN         seek -60

# Jump to a percentage of the clip. Digits are contrast/brightness/gamma by
# default, which is useless for YouTube; volume keeps `/` and `*` (also mpv
# defaults), so nothing is lost.
0 seek  0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent

HOME seek 0 absolute

# Exact position, typed in: mm:ss, h:mm:ss, 42%, +90, -90 (see yt_seek.lua).
t script-binding yt_seek/goto
g script-binding yt_seek/goto
